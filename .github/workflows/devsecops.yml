name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  devsecops-quality-and-security:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'IngenieroDocente_CI_Test_Secret_2026!' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-api-key-for-ci' }}
      ALLOWED_ORIGIN: '*'
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Clean stale install state
        run: |
          rm -rf node_modules
          rm -f package-lock.json bun.lock
          npm cache clean --force

      - name: Install dependencies
        run: npm install --no-fund --no-audit --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Run Mutation Testing (StrykerJS - fails if score < 50%)
        run: npm run test:mutation
