name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  devsecops-quality-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure CI runtime environment
        run: |
          echo "JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")" >> "$GITHUB_ENV"
          echo "GEMINI_API_KEY=ci-placeholder-key" >> "$GITHUB_ENV"
          echo "ALLOWED_ORIGIN=http://localhost:3000" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Run Mutation Testing (StrykerJS - fails if score < 50%)
        run: npm run test:mutation
