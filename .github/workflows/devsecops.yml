name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  devsecops-quality-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'IngenieroDocente_CI_Test_Secret_2026!' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'test-api-key-for-ci' }}
      ALLOWED_ORIGIN: '*'
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: TypeScript typecheck
        run: bun run lint

      - name: Build application
        run: bun run build

      - name: Run unit tests (Vitest)
        run: bun run test

      - name: Run Mutation Testing (StrykerJS)
        run: bun run test:mutation
