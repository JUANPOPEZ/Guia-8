name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JWT_SECRET: ci-devsecops-jwt-secret-key-2026-secure
  GEMINI_API_KEY: ci-placeholder-gemini-api-key
  ALLOWED_ORIGIN: '*'

jobs:
  devsecops-quality-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Run Mutation Testing (StrykerJS - fails if score < 50%)
        run: npm run test:mutation
