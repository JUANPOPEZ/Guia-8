    <script>
      // Suppress Vite HMR WebSocket errors in AI Studio iframe preview
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.toString())) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
          event.preventDefault();
        }
      });
    </script>
